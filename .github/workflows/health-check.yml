name: Environment Health Check

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # devcontainer のイメージが大きく（Chrome を入れて約 530MB 増えた）、ランナーの
      # ディスクが足りないとイメージの書き出し中にエラー文なしでジョブが止まる。
      # 使わないプリインストールのツールを消して空きを作り、前後の空き容量をログに残す。
      - name: Free disk space on runner
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/share/powershell
          sudo docker image prune --all --force
          df -h /

      - name: Run setup scripts tests in dev container
        uses: devcontainers/ci@v0.3
        with:
          configFile: .devcontainer/cpu/devcontainer.json
          runCmd: |
            # セットアップスクリプトのテストを実行
            bash scripts/test/run-setup-tests.sh all

      - name: Run health check in dev container
        uses: devcontainers/ci@v0.3
        with:
          configFile: .devcontainer/cpu/devcontainer.json
          runCmd: |
            scripts/health/check-environment.sh --json > health-check-result.json
            cat health-check-result.json
            # Run health check and allow warnings (exit code 2)
            scripts/health/check-environment.sh --no-color || [ $? -eq 2 ]

      - name: Upload health check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-check-results
          path: health-check-result.json
          retention-days: 30

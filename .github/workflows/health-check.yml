name: Environment Health Check

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # イメージの書き出し中にエラー文なしでジョブが止まることがある（原因を調査中）。
      # ディスクは空いていた（約 86GB）ので、メモリとカーネルのログを残して切り分ける。
      - name: Show runner resources
        run: |
          df -h /
          free -h
          nproc

      - name: Run setup scripts tests in dev container
        uses: devcontainers/ci@v0.3
        with:
          configFile: .devcontainer/cpu/devcontainer.json
          runCmd: |
            # セットアップスクリプトのテストを実行
            bash scripts/test/run-setup-tests.sh all

      - name: Run health check in dev container
        uses: devcontainers/ci@v0.3
        with:
          configFile: .devcontainer/cpu/devcontainer.json
          runCmd: |
            scripts/health/check-environment.sh --json > health-check-result.json
            cat health-check-result.json
            # Run health check and allow warnings (exit code 2)
            scripts/health/check-environment.sh --no-color || [ $? -eq 2 ]

      - name: Show runner diagnostics on failure
        if: failure()
        run: |
          df -h /
          free -h
          # OOM killer がプロセスを止めていれば、ここに記録が残る
          sudo dmesg | grep -iE 'out of memory|oom|killed process' || echo "no OOM records in dmesg"
          docker ps -a || true

      - name: Upload health check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-check-results
          path: health-check-result.json
          retention-days: 30
